<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מסע אל העבר – דינוזאורים וחיות קדומות</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#0b3c5d; --sea:#1d6f8f; --teal:#2a9d8f; --green:#3fa34d; --mint:#e8f6f0; --ink:#12313f;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:"Rubik", "Arial Hebrew", Arial, sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--deep) 0%,var(--sea) 45%,var(--teal) 75%,var(--green) 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 14px 40px;
  }
  h1{margin:4px 0 4px;font-size:clamp(28px,6vw,46px);color:#fff;font-weight:700;text-align:center;letter-spacing:.5px}
  .sub{color:#bfe9dd;margin:0 0 18px;font-size:18px;text-align:center}
  .card{
    width:min(760px,100%);background:var(--mint);border-radius:20px;
    box-shadow:0 18px 40px rgba(0,0,0,.3);overflow:hidden;
  }
  .pic{
    position:relative;background:#0e2a38;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  }
  .pic img{width:100%;height:100%;object-fit:contain}
  .placeholder{color:#9fd8cb;font-size:20px;text-align:center}
  .placeholder span{display:block;font-size:72px;margin-bottom:8px}
  .caption{position:absolute;bottom:0;right:0;left:0;padding:6px 12px;font-size:13px;
    color:#e8f6f0;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  .caption a{color:#9fe3d2}
  .body{padding:20px 24px 24px}
  .name{font-size:clamp(28px,6vw,40px);margin:0 0 10px;color:var(--deep)}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .tag{padding:5px 13px;border-radius:999px;font-size:16px;color:#fff}
  .t-era{background:var(--deep)}
  .t-plant{background:var(--green)}
  .t-meat{background:#1b5e7a}
  .t-fish{background:#2b8fbf}
  .t-mixed{background:var(--teal)}
  .t-dino{background:#2e7d4f}
  .t-not{background:#5b7f8f}
  .facts{font-size:19px;line-height:1.7;margin:0;padding-right:22px}
  .wow{margin-top:14px;background:#fff;border-right:6px solid var(--teal);border-radius:12px;padding:12px 16px;font-size:19px;line-height:1.6}
  .wow h3{margin:0 0 4px;font-size:19px;color:var(--teal)}
  .credit{margin-top:12px;font-size:14px;color:#4d6b75}
  .credit a{color:var(--sea)}
  button{
    margin-top:22px;font-family:inherit;font-size:clamp(20px,4.5vw,26px);
    background:#fff;color:var(--deep);border:none;border-radius:14px;
    padding:12px 30px;cursor:pointer;box-shadow:0 6px 0 #9fd8cb;font-weight:700;
    transition:transform .1s, box-shadow .1s;
  }
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #9fd8cb}
  .share{margin-top:14px;background:var(--green);color:#fff;box-shadow:0 6px 0 #1f6b2e;font-size:clamp(18px,4vw,22px)}
  .share:active{box-shadow:0 2px 0 #1f6b2e}
  /* הכול בעמוד אחד, בלי גלילה */
  html,body{height:100%}
  body{height:100vh;height:100dvh;overflow:hidden;padding:10px 12px 12px}
  h1{font-size:clamp(22px,4.5vh,40px);margin:0}
  .sub{font-size:clamp(13px,2vh,17px);margin:2px 0 8px}
  .card{flex:1;min-height:0;display:flex;flex-direction:column;width:min(1100px,100%)}
  .pic{aspect-ratio:auto;flex:1 1 50%;min-height:0}
  .body{flex:0 1 auto;min-height:0;overflow:auto;padding:clamp(8px,1.6vh,18px) 20px}
  .name{font-size:clamp(22px,4vh,36px);margin:0 0 6px}
  .tag{font-size:clamp(12px,1.8vh,16px);padding:3px 11px}
  .tags{margin-bottom:8px;gap:6px}
  .facts{font-size:clamp(14px,2.2vh,19px);line-height:1.5}
  .wow{font-size:clamp(14px,2.2vh,19px);line-height:1.5;margin-top:8px;padding:8px 14px}
  .wow h3{font-size:clamp(14px,2.2vh,19px)}
  .credit{margin-top:6px;font-size:13px}
  .buttons{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:12px}
  button{margin-top:0;font-size:clamp(16px,2.6vh,24px);padding:clamp(6px,1.3vh,12px) 26px}
  /* מסך רחב: תמונה מימין, טקסט משמאל */
  @media (min-aspect-ratio:5/4) and (min-width:760px){
    .card{flex-direction:row}
    .pic{flex:1.4 1 0}
    .body{flex:1 1 0;display:flex;flex-direction:column;justify-content:center}
  }
  .search{position:relative;width:min(420px,100%);margin:0 auto 10px;z-index:5}
  .search input{width:100%;font-family:inherit;font-size:clamp(15px,2.2vh,18px);padding:8px 16px;
    border:none;border-radius:999px;background:#e8f6f0;color:var(--ink);outline:3px solid transparent}
  .search input:focus{outline-color:#9fe3d2}
  .results{position:absolute;top:calc(100% + 6px);right:0;left:0;margin:0;padding:6px;list-style:none;
    background:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);max-height:50vh;overflow:auto}
  .results li{padding:8px 12px;border-radius:10px;cursor:pointer;font-size:17px}
  .results li:hover,.results li.active{background:#d9f2ea}
  .results li.none{cursor:default;color:#5b7f8f}
  .results li.none:hover{background:none}
</style>
</head>
<body>
<h1>מסע אל העבר</h1>
<p class="sub">דינוזאורים וחיות קדומות – כל פעם אחת אחרת</p>
<div class="search">
  <input id="q" type="search" placeholder="🔍 חיפוש יצור לפי שם…" autocomplete="off">
  <ul id="results" class="results" hidden></ul>
</div>

<div class="card">
  <div class="pic" id="pic"></div>
  <div class="body">
    <h2 class="name" id="name"></h2>
    <div class="tags" id="tags"></div>
    <ul class="facts" id="facts"></ul>
    <div class="wow" id="wow"></div>
    <div class="credit" id="credit"></div>
  </div>
</div>

<div class="buttons">
<button id="next">עוד יצור ←</button>
<button id="share" class="share">תרצה לשתף את תמיר ועינבר?</button>
</div>

const DIET = {plant:["🌿 צמחוני","t-plant"], meat:["🍖 טורף","t-meat"], fish:["🐟 אוכל דגים","t-fish"], mixed:["🥣 אוכל הכול","t-mixed"]};

// יצור שהופיע לא יופיע שוב עד שיופיעו לפחות 10 יצורים אחרים
const GAP = 10;
let memHistory = [];
function loadHist(){
  let hist = memHistory;
  try { hist = JSON.parse(localStorage.getItem("dino-history") || "[]"); } catch(e){}
  return hist.filter(n => Number.isInteger(n) && n >= 0 && n < ANIMALS.length);
}
function record(i){
  let hist = loadHist().filter(n => n !== i);
  hist.push(i);
  hist = hist.slice(-GAP);
  memHistory = hist;
  try { localStorage.setItem("dino-history", JSON.stringify(hist)); } catch(e){}
}
function pickIndex(){
  const recent = loadHist().slice(-GAP);
  const options = ANIMALS.map((_, n) => n).filter(n => !recent.includes(n));
  return options[Math.floor(Math.random() * options.length)];
}

let token = 0;
async function show(chosen){
  document.getElementById("share").textContent = "תרצה לשתף את תמיר ועינבר?";
  const idx = Number.isInteger(chosen) ? chosen : pickIndex();
  record(idx);
  const a = ANIMALS[idx];
  const my = ++token;
  document.getElementById("name").textContent = a.name;
  const d = DIET[a.diet];
  document.getElementById("tags").innerHTML =
    `<span class="tag t-era">⏳ ${a.era}</span>` +
    `<span class="tag ${d[1]}">${d[0]}</span>` +
    (a.dino ? `<span class="tag t-dino">🦕 דינוזאור</span>` : `<span class="tag t-not">❗ לא דינוזאור</span>`);
  document.getElementById("facts").innerHTML = `<li>📏 ${a.size}</li><li>⚖️ ${a.weight}</li><li>📍 מאובנים נמצאו ב: ${a.where}</li>`;
  document.getElementById("wow").innerHTML = `<h3>💡 הידעת?</h3>${a.wow}`;
  const pic = document.getElementById("pic");
  pic.innerHTML = `<div class="placeholder"><span>${a.emoji}</span>מחפש תמונה של שלד או מאובן…</div>`;
  const link = "https://en.wikipedia.org/wiki/" + encodeURIComponent(a.wiki.replace(/ /g,"_"));
  document.getElementById("credit").innerHTML = `לקריאה נוספת: <a href="${link}" target="_blank" rel="noopener">הערך בוויקיפדיה</a>`;

  let found = await fromCommons(a.q);
  if (!found) found = await fromWikipedia(a.wiki);
  if (my !== token) return;
  if (!found){
    pic.innerHTML = `<div class="placeholder"><span>${a.emoji}</span>אין חיבור לאינטרנט – התמונה לא נטענה</div>`;
    return;
  }
  const img = new Image();
  img.alt = a.name;
  img.onload = () => {
    if (my !== token) return;
    pic.innerHTML = "";
    pic.appendChild(img);
    const c = document.createElement("div");
    c.className = "caption";
    c.innerHTML = `תמונה: <a href="${found.page}" target="_blank" rel="noopener">${found.source}</a>`;
    pic.appendChild(c);
  };
  img.src = found.src;
}

// חיפוש צילום אמיתי (שלד / מאובן) בוויקישיתוף
async function fromCommons(q){
  try{
    const url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*" +
      "&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=" + encodeURIComponent(q + " filetype:bitmap") +
      "&prop=imageinfo&iiprop=url|mime&iiurlwidth=900";
    const j = await (await fetch(url)).json();
    if (!j.query) return null;
    const pages = Object.values(j.query.pages)
      .sort((x,y)=>x.index-y.index)
      .filter(p => p.imageinfo && /jpeg|png/.test(p.imageinfo[0].mime));
    if (!pages.length) return null;
    const p = pages[Math.floor(Math.random()*Math.min(4,pages.length))];
    return {src:p.imageinfo[0].thumburl || p.imageinfo[0].url, page:p.imageinfo[0].descriptionurl, source:"ויקישיתוף"};
  }catch(e){ return null; }
}

// גיבוי: התמונה הראשית של הערך בוויקיפדיה
async function fromWikipedia(title){
  try{
    const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles=" + encodeURIComponent(title);
    const j = await (await fetch(url)).json();
    const page = Object.values(j.query.pages)[0];
    const src = page && page.thumbnail && page.thumbnail.source;
    return src ? {src, page:"https://en.wikipedia.org/wiki/" + encodeURIComponent(title.replace(/ /g,"_")), source:"ויקיפדיה"} : null;
  }catch(e){ return null; }
}

document.getElementById("next").addEventListener("click", () => show());

// חיפוש במאגר
const qInput = document.getElementById("q");
const resList = document.getElementById("results");
let matches = [], active = 0;
const norm = t => t.toLowerCase().replace(/[\u0591-\u05C7"'׳״\-–\s]/g, "");
function renderResults(){
  const term = norm(qInput.value);
  if (!term){ resList.hidden = true; return; }
  matches = ANIMALS.map((a, i) => i).filter(i => norm(ANIMALS[i].name).includes(term) || norm(ANIMALS[i].wiki).includes(term));
  matches.sort((x, y) => norm(ANIMALS[y].name).startsWith(term) - norm(ANIMALS[x].name).startsWith(term));
  active = 0;
  resList.innerHTML = matches.length
    ? matches.map((i, k) => `<li data-i="${i}" class="${k === 0 ? "active" : ""}">${ANIMALS[i].emoji} ${ANIMALS[i].name}</li>`).join("")
    : `<li class="none">לא נמצא יצור בשם הזה</li>`;
  resList.hidden = false;
}
function choose(i){
  qInput.value = "";
  resList.hidden = true;
  qInput.blur();
  show(i);
}
qInput.addEventListener("input", renderResults);
qInput.addEventListener("keydown", e => {
  if (resList.hidden || !matches.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault();
    active = (active + (e.key === "ArrowDown" ? 1 : -1) + matches.length) % matches.length;
    [...resList.children].forEach((li, k) => li.classList.toggle("active", k === active));
    resList.children[active].scrollIntoView({block:"nearest"});
  } else if (e.key === "Enter"){
    e.preventDefault();
    choose(matches[active]);
  } else if (e.key === "Escape"){
    resList.hidden = true;
  }
});
resList.addEventListener("mousedown", e => {
  const li = e.target.closest("li[data-i]");
  if (li){ e.preventDefault(); choose(Number(li.dataset.i)); }
});
qInput.addEventListener("blur", () => setTimeout(() => resList.hidden = true, 150));
document.getElementById("share").addEventListener("click", () => {
  document.getElementById("share").textContent = "אבאאא אמאאא ידעתם ש...";
});
show();
